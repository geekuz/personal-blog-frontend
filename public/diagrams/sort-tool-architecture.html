<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Build Your Own Sort architecture</title>
<link rel="icon" href="/favicon.svg" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa;
    --fg: #111827;
    --muted: #667085;
    --line: #98a2b3;
    --neutral: #f2f4f7;
    --input: #dbeafe;
    --process: #e0e7ff;
    --storage: #d1fae5;
    --external: #fef3c7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318;
      --fg: #f5f7fa;
      --muted: #a8b0bd;
      --line: #667085;
      --neutral: #252932;
      --input: #1e3a5f;
      --process: #30356b;
      --storage: #164e3c;
      --external: #644915;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 980px; margin: 0 auto; padding: 24px; }
  svg { width: 100%; height: auto; display: block; }
  .mobile { display: none; }
  .title { font-size: 20px; font-weight: 700; fill: var(--fg); }
  .label { font-size: 14px; font-weight: 700; fill: var(--fg); }
  .small { font-size: 12px; fill: var(--muted); }
  .node { stroke: var(--line); stroke-width: 1; }
  .neutral { fill: var(--neutral); }
  .input { fill: var(--input); }
  .process { fill: var(--process); }
  .storage { fill: var(--storage); }
  .external { fill: var(--external); }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .zone { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 5; }
  @media (max-width: 620px) {
    main { padding: 18px; }
    .desktop { display: none; }
    .mobile { display: block; }
  }
</style>
<main>
  <svg class="desktop" viewBox="0 0 920 430" role="img" aria-labelledby="desktop-title desktop-desc">
    <title id="desktop-title">Sort tool processing architecture</title>
    <desc id="desktop-desc">Files and standard input flow through argument parsing, immutable options, line reading, a selected sorting strategy, optional adjacent deduplication, and standard output.</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" /></marker>
    </defs>

    <path class="edge" marker-end="url(#arrow)" d="M170 117 H225" />
    <path class="edge" marker-end="url(#arrow)" d="M170 223 H225" />
    <path class="edge" marker-end="url(#arrow)" d="M385 170 H440" />
    <path class="edge" marker-end="url(#arrow)" d="M600 170 H655" />
    <path class="edge" marker-end="url(#arrow)" d="M735 215 V275" />
    <path class="edge" marker-end="url(#arrow)" d="M655 330 H600" />
    <path class="edge" marker-end="url(#arrow)" d="M440 330 H385" />
    <path class="edge" marker-end="url(#arrow)" d="M225 330 H170" />

    <text x="0" y="25" class="title">One linear pipeline, interchangeable algorithms</text>
    <text x="0" y="48" class="small">The CLI owns I/O and validation; every sorter is a pure strategy returning a new array.</text>

    <rect x="10" y="78" width="160" height="78" rx="2" class="node input" />
    <text x="34" y="108" class="label">Command line</text>
    <text x="34" y="130" class="small">flags + file paths</text>

    <rect x="10" y="184" width="160" height="78" rx="2" class="node input" />
    <text x="34" y="214" class="label">Input sources</text>
    <text x="34" y="236" class="small">files + stdin</text>

    <rect x="225" y="125" width="160" height="90" rx="2" class="node process" />
    <text x="249" y="157" class="label">ArgumentParser</text>
    <text x="249" y="180" class="small">validated SortOptions</text>
    <text x="249" y="198" class="small">fail fast on bad flags</text>

    <rect x="440" y="125" width="160" height="90" rx="2" class="node process" />
    <text x="464" y="157" class="label">SortTool</text>
    <text x="464" y="180" class="small">read all lines</text>
    <text x="464" y="198" class="small">select strategy</text>

    <rect x="655" y="92" width="250" height="123" rx="2" class="node storage" />
    <text x="679" y="124" class="label">Sorter strategy</text>
    <text x="679" y="149" class="small">merge · quick · heap · MSD radix</text>
    <text x="679" y="170" class="small">salted SHA-256 random ordering</text>
    <text x="679" y="191" class="small">new array; caller input unchanged</text>

    <rect x="655" y="275" width="250" height="110" rx="2" class="node process" />
    <text x="679" y="307" class="label">Output policy</text>
    <text x="679" y="331" class="small">optional adjacent dedupe (-u)</text>
    <text x="679" y="352" class="small">write one line at a time</text>

    <rect x="440" y="290" width="160" height="80" rx="2" class="node neutral" />
    <text x="464" y="322" class="label">Sorted lines</text>
    <text x="464" y="345" class="small">lexical or grouped random</text>

    <rect x="225" y="290" width="160" height="80" rx="2" class="node external" />
    <text x="249" y="322" class="label">PrintStream</text>
    <text x="249" y="345" class="small">UTF-8 text output</text>

    <rect x="10" y="290" width="160" height="80" rx="2" class="node external" />
    <text x="34" y="322" class="label">stdout</text>
    <text x="34" y="345" class="small">pipe or terminal</text>
  </svg>

  <svg class="mobile" viewBox="0 0 360 820" role="img" aria-labelledby="mobile-title mobile-desc">
    <title id="mobile-title">Sort tool processing architecture</title>
    <desc id="mobile-desc">Command-line options and input lines move through parsing, the SortTool orchestrator, a selected sorting strategy, optional deduplication, and standard output.</desc>
    <defs>
      <marker id="arrow-mobile" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" /></marker>
    </defs>

    <path class="edge" marker-end="url(#arrow-mobile)" d="M180 145 V180" />
    <path class="edge" marker-end="url(#arrow-mobile)" d="M180 267 V302" />
    <path class="edge" marker-end="url(#arrow-mobile)" d="M180 389 V424" />
    <path class="edge" marker-end="url(#arrow-mobile)" d="M180 531 V566" />
    <path class="edge" marker-end="url(#arrow-mobile)" d="M180 653 V688" />

    <text x="0" y="24" class="title">Sort tool pipeline</text>
    <text x="0" y="47" class="small">Validated input → selected strategy → output</text>

    <rect x="20" y="75" width="320" height="70" rx="2" class="node input" />
    <text x="44" y="103" class="label">CLI + input sources</text>
    <text x="44" y="125" class="small">flags · files · stdin</text>

    <rect x="20" y="180" width="320" height="87" rx="2" class="node process" />
    <text x="44" y="211" class="label">ArgumentParser</text>
    <text x="44" y="234" class="small">immutable, validated SortOptions</text>

    <rect x="20" y="302" width="320" height="87" rx="2" class="node process" />
    <text x="44" y="333" class="label">SortTool</text>
    <text x="44" y="356" class="small">read lines + choose strategy</text>

    <rect x="20" y="424" width="320" height="107" rx="2" class="node storage" />
    <text x="44" y="455" class="label">Sorter</text>
    <text x="44" y="478" class="small">merge · quick · heap · MSD radix</text>
    <text x="44" y="500" class="small">salted SHA-256 random ordering</text>

    <rect x="20" y="566" width="320" height="87" rx="2" class="node process" />
    <text x="44" y="597" class="label">Output policy</text>
    <text x="44" y="620" class="small">optional adjacent dedupe (-u)</text>

    <rect x="20" y="688" width="320" height="87" rx="2" class="node external" />
    <text x="44" y="719" class="label">stdout</text>
    <text x="44" y="742" class="small">sorted UTF-8 lines</text>
  </svg>
</main>
