<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>otabek.dev system architecture</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6f7;
        --fg: #09090b;
        --muted: #71717a;
        --line: #71717a;
        --neutral: #e4e4e7;
        --input: #dbeafe;
        --process: #e0e7ff;
        --storage: #ccfbf1;
        --external: #fef3c7;
        --accent: #2a3fff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131316;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --line: #71717a;
          --neutral: #27272a;
          --input: #1e3a5f;
          --process: #312e81;
          --storage: #134e4a;
          --external: #78350f;
          --accent: #8593ff;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { padding: 20px; }
      svg { width: 100%; height: auto; display: block; }
      .mobile { display: none; }
      .title { font-size: 20px; font-weight: 700; fill: var(--fg); }
      .label { font-size: 15px; font-weight: 650; fill: var(--fg); }
      .small { font-size: 12px; fill: var(--muted); }
      .micro { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; fill: var(--muted); }
      .node { stroke: var(--line); stroke-width: 1; }
      .input { fill: var(--input); }
      .process { fill: var(--process); }
      .storage { fill: var(--storage); }
      .external { fill: var(--external); }
      .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
      .zone { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 5; opacity: .65; }
      .accent { fill: var(--accent); }
      @media (max-width: 640px) {
        main { padding: 12px; }
        .desktop { display: none; }
        .mobile { display: block; }
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="desktop" viewBox="0 0 960 520" role="img" aria-labelledby="desktop-title desktop-desc">
        <title id="desktop-title">otabek.dev production architecture</title>
        <desc id="desktop-desc">A browser loads the React application from Vercel. The application calls a Spring Boot API on Render, which uses PostgreSQL, Cloudflare R2, and Resend.</desc>
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path class="accent" d="M0 0 10 5 0 10Z" />
          </marker>
        </defs>

        <rect class="zone" x="220" y="58" width="210" height="400" />
        <text class="micro" x="244" y="88">Vercel edge</text>
        <rect class="zone" x="445" y="28" width="475" height="460" />
        <text class="micro" x="469" y="58">Application and managed services</text>

        <path class="edge" marker-end="url(#arrow)" d="M190 260H240" />
        <path class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M410 250H460" />
        <path class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M650 210C683 210 678 130 710 130" />
        <path class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M650 250H710" />
        <path class="edge" marker-end="url(#arrow)" d="M650 290C683 290 678 410 710 410" />

        <text class="small" x="193" y="246">HTTPS</text>
        <text class="small" x="416" y="236">JSON</text>
        <text class="small" x="416" y="266">cookie</text>

        <rect class="node external" x="40" y="205" width="150" height="110" />
        <text class="micro" x="64" y="232">Client</text>
        <text class="label" x="64" y="264">Reader / admin</text>
        <text class="small" x="64" y="288">Web browser</text>

        <rect class="node input" x="240" y="185" width="170" height="130" />
        <text class="micro" x="264" y="214">Frontend</text>
        <text class="label" x="264" y="247">React 19 SPA</text>
        <text class="small" x="264" y="272">Vite + Tailwind</text>
        <text class="small" x="264" y="292">Routes + proxy rules</text>

        <rect class="node process" x="460" y="170" width="190" height="160" />
        <text class="micro" x="484" y="200">Render</text>
        <text class="label" x="484" y="234">Spring Boot API</text>
        <text class="small" x="484" y="260">Auth + publishing</text>
        <text class="small" x="484" y="281">Search + discovery</text>
        <text class="small" x="484" y="302">Media + newsletters</text>

        <rect class="node storage" x="710" y="80" width="190" height="100" />
        <text class="micro" x="734" y="108">Primary data</text>
        <text class="label" x="734" y="140">PostgreSQL</text>
        <text class="small" x="734" y="161">Posts, users, sessions</text>

        <rect class="node storage" x="710" y="205" width="190" height="100" />
        <text class="micro" x="734" y="233">Object storage</text>
        <text class="label" x="734" y="265">Cloudflare R2</text>
        <text class="small" x="734" y="286">Uploaded media</text>

        <rect class="node external" x="710" y="360" width="190" height="100" />
        <text class="micro" x="734" y="388">Email provider</text>
        <text class="label" x="734" y="420">Resend</text>
        <text class="small" x="734" y="441">Transactional + newsletter</text>
      </svg>

      <svg class="mobile" viewBox="0 0 420 650" role="img" aria-labelledby="mobile-title mobile-desc">
        <title id="mobile-title">otabek.dev production architecture</title>
        <desc id="mobile-desc">A browser loads React from Vercel. React calls Spring Boot on Render. The API connects to PostgreSQL, Cloudflare R2, and Resend.</desc>
        <defs>
          <marker id="arrow-mobile" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path class="accent" d="M0 0 10 5 0 10Z" />
          </marker>
        </defs>

        <path class="edge" marker-end="url(#arrow-mobile)" d="M210 120V158" />
        <path class="edge" marker-start="url(#arrow-mobile)" marker-end="url(#arrow-mobile)" d="M210 258V298" />
        <path class="edge" marker-start="url(#arrow-mobile)" marker-end="url(#arrow-mobile)" d="M210 408V454H72V490" />
        <path class="edge" marker-start="url(#arrow-mobile)" marker-end="url(#arrow-mobile)" d="M210 408V490" />
        <path class="edge" marker-end="url(#arrow-mobile)" d="M210 454H348V490" />

        <rect class="node external" x="60" y="30" width="300" height="90" />
        <text class="micro" x="84" y="58">Client</text>
        <text class="label" x="84" y="87">Reader / admin browser</text>
        <text class="small" x="84" y="106">HTTPS</text>

        <rect class="node input" x="60" y="158" width="300" height="100" />
        <text class="micro" x="84" y="187">Vercel edge</text>
        <text class="label" x="84" y="217">React 19 SPA</text>
        <text class="small" x="84" y="239">Vite, Tailwind, routes and proxy rules</text>

        <rect class="node process" x="60" y="298" width="300" height="110" />
        <text class="micro" x="84" y="327">Render</text>
        <text class="label" x="84" y="357">Spring Boot API</text>
        <text class="small" x="84" y="380">Auth, content, search, discovery and email</text>

        <rect class="node storage" x="10" y="490" width="125" height="110" />
        <text class="micro" x="26" y="518">Data</text>
        <text class="label" x="26" y="548">PostgreSQL</text>
        <text class="small" x="26" y="571">Posts, users</text>
        <text class="small" x="26" y="588">and sessions</text>

        <rect class="node storage" x="148" y="490" width="125" height="110" />
        <text class="micro" x="164" y="518">Media</text>
        <text class="label" x="164" y="548">R2</text>
        <text class="small" x="164" y="571">Uploaded</text>
        <text class="small" x="164" y="588">images</text>

        <rect class="node external" x="286" y="490" width="125" height="110" />
        <text class="micro" x="302" y="518">Email</text>
        <text class="label" x="302" y="548">Resend</text>
        <text class="small" x="302" y="571">Transactional</text>
        <text class="small" x="302" y="588">and newsletter</text>
      </svg>
    </main>
  </body>
</html>
