<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Otabek's blog — learning React by building it."
    />
    <title>otabek.dev — Writing</title>
    <link
      rel="alternate"
      type="application/rss+xml"
      title="otabek.dev — Writing"
      href="/feed.xml"
    />
    <!--
      Link-preview defaults for the home page. Post pages get per-post tags from
      the backend share page (see vercel.json), because preview bots do not run JS.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="otabek.dev — Writing" />
    <meta property="og:title" content="otabek.dev — Writing" />
    <meta
      property="og:description"
      content="Otabek's blog — learning React by building it."
    />
    <meta name="twitter:card" content="summary" />
    <!--
      Anti-flash script. This runs BEFORE React and before the page paints, so
      it applies the saved theme immediately. Without it, the page
      would briefly flash light before React's effect adds the `dark` class.
      It reads the same localStorage key/format that useLocalStorage writes.
    -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('theme'))
        if (t === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
